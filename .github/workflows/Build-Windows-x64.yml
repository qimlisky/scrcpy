name: Build-Windows-x64

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Version name (default is ref name)'

env:
  VERSION: ${{ github.event.inputs.name || github.ref_name }}

jobs:
  build-scrcpy-server:
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle  # use native gradle instead of ./gradlew in scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build
        run: release/build_server.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-server
          path: release/work/build-server/server/scrcpy-server

  build-win64:
    # 锁定 22.04，避开 ubuntu-latest 滚动更新导致的 GnuTLS/证书差异
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Pre-download FFmpeg with curl (bypass wget GnuTLS issue)
        run: |
          mkdir -p app/deps/work/sources
          curl -L --retry 5 --retry-delay 5 --connect-timeout 30 \
            -o app/deps/work/sources/ffmpeg-9.0.2.tar.xz \
            https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
          echo "Downloaded FFmpeg:"
          ls -lh app/deps/work/sources/ffmpeg-9.0.2.tar.xz
          # 校验 SHA256，确保文件完整
          echo "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e  app/deps/work/sources/ffmpeg-9.0.2.tar.xz" | sha256sum -c -

      - name: Build
        run: release/build_windows.sh 64

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
            cd release/work/build-win64
            mkdir dist-tar
            cd dist-tar
            tar -C .. -cvf dist.tar.gz dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

  package-win64:
    needs:
      - build-scrcpy-server
      - build-win64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build-win64
        uses: actions/download-artifact@v8
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
            cd release/work/build-win64
            tar xf dist-tar/dist.tar.gz
      - name: Package
        run: release/package_client.sh win64 zip

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-win64
          path: release/output

  release:
    needs:
      - build-scrcpy-server
      - package-win64
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 并上传附件需要写权限
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download release-win64
        uses: actions/download-artifact@v8
        with:
          name: release-win64
          path: release/output/

      - name: Package server
        run: release/package_server.sh

      - name: Generate checksums
        run: release/generate_checksums.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-release-${{ env.VERSION }}
          path: release/output

      # 新增：创建/更新 GitHub Release 并上传构建产物作为附件
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: release/output/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
